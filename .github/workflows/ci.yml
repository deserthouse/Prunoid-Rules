name: ci
on:
  pull_request:
    paths: ["rules/**", "scripts/**", "README.md"]
  push:
    branches: [main]
    paths: ["rules/**", "scripts/**", "README.md"]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # README 门禁需要读取最新 tag
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/validate_rules.py rules/snapshot.json
      - run: python scripts/check_readme_sync.py
